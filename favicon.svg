<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded square background, Odin Burgundy -->
  <rect width="64" height="64" rx="12" fill="#7B2D45"/>

  <!-- Hexagon + spokes group, Odin Cream stroke -->
  <g fill="none" stroke="#FAF6EE" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Flat-top hexagon, centred at (32,32), radius 20 -->
    <polygon points="52,32 42,49.32 22,49.32 12,32 22,14.68 42,14.68"/>

    <!-- Spokes from each vertex to centre -->
    <line x1="52" y1="32" x2="32" y2="32"/>
    <line x1="42" y1="49.32" x2="32" y2="32"/>
    <line x1="22" y1="49.32" x2="32" y2="32"/>
    <line x1="12" y1="32" x2="32" y2="32"/>
    <line x1="22" y1="14.68" x2="32" y2="32"/>
    <line x1="42" y1="14.68" x2="32" y2="32"/>
  </g>

  <!-- Centre hub -->
  <circle cx="32" cy="32" r="3.2" fill="#7B2D45" stroke="#FAF6EE" stroke-width="2.2"/>
</svg>
