<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F5F0EA">
  <title>Odin — Someone shared this with you</title>

  <!-- OG preview for iMessage / WhatsApp / Slack -->
  <meta property="og:title" content="Someone shared a recommendation with you on Odin">
  <meta property="og:description" content="Odin is a private discovery network. By invite only.">
  <meta property="og:type" content="website">
  <!-- Static Odin logo for the link-preview thumbnail. Hardcoded to the
       production host so WhatsApp / iMessage crawlers can always fetch it,
       even when the share URL itself is on staging. Same logo file in both
       environments, so there is no cross-env mismatch. Per-item dynamic OG
       (the actual food / place photo) is a separate, deferred ticket. -->
  <meta property="og:image" content="https://www.join-odin.com/icon-512.png">
  <meta property="og:image:secure_url" content="https://www.join-odin.com/icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="Odin">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="https://www.join-odin.com/icon-512.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=DM+Sans:wght@400;500;600&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* Brand tokens — must stay in sync with index.html :root */
    :root {
      --wb:        #7B2D45;
      --wb-light:  #9B4D65;
      --wb-hover:  #5A1F30;
      --ink:       #2A1E14;
      --bg:        #FAF6EE;
      --lp-surface:#FFFFFF;
      --muted:     #9A8A7A;
      --border:    #EAE0D2;
      --mason:     #DDD0B8;
      --dark:      #1A100A;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--dark);
      color: var(--bg);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 16px calc(48px + env(safe-area-inset-bottom));
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Winterberry radial glow — same recipe as the landing page left side */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 70% 60% at -5% 90%, rgba(123,45,69,0.20) 0%, transparent 60%),
        radial-gradient(ellipse 40% 35% at 100% 5%, rgba(123,45,69,0.07) 0%, transparent 55%);
    }
    /* Subtle film-grain — keeps the dark surface from looking flat */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      position: relative;
      z-index: 2;
    }
    .brand-lockup img {
      width: 44px;
      height: 44px;
      border-radius: 11px;
      display: block;
    }
    .wordmark {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.06em;
      line-height: 1;
    }
    /* Same split-colour treatment as the landing-page logo */
    .wordmark .ws-o   { color: var(--wb); }
    .wordmark .ws-din { color: var(--mason); }

    .container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 2;
    }

    .card {
      background: var(--bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.20);
    }

    .card-photo {
      width: 100%;
      aspect-ratio: 16 / 11;
      object-fit: cover;
      background: var(--mason);
      display: block;
    }

    .card-photo-placeholder {
      width: 100%;
      aspect-ratio: 16 / 11;
      background: linear-gradient(135deg, var(--mason) 0%, #C9BBA5 100%);
    }

    .card-body { padding: 22px 20px 24px; }

    .sharer-line {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
      line-height: 1.4;
      font-weight: 500;
    }
    .sharer-line strong {
      color: var(--ink);
      font-weight: 700;
    }

    .card-title {
      font-family: 'Fraunces', serif;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .card-meta {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .badge {
      display: inline-block;
      background: var(--wb);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      margin-right: 8px;
      letter-spacing: 0.02em;
    }

    .the-word {
      background: rgba(123,45,69,0.06);
      border-left: 3px solid var(--wb);
      border-radius: 0 8px 8px 0;
      padding: 12px 14px;
      margin-bottom: 22px;
    }
    .the-word-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--wb);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .the-word-text {
      font-family: 'Fraunces', serif;
      font-size: 15px;
      color: var(--ink);
      font-style: italic;
      line-height: 1.55;
    }

    .cta-primary {
      display: block;
      width: 100%;
      background: var(--wb);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      padding: 15px 16px;
      cursor: pointer;
      text-align: center;
      margin-bottom: 8px;
      transition: background 0.15s ease, transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 2px 8px rgba(123,45,69,0.25);
    }
    .cta-primary:hover { background: var(--wb-hover); }
    .cta-primary:active { transform: scale(0.98); }
    .cta-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .tagline {
      font-size: 12px;
      color: var(--mason);
      text-align: center;
      line-height: 1.7;
      margin-top: 24px;
      opacity: 0.75;
      letter-spacing: 0.01em;
      position: relative;
      z-index: 2;
    }

    .error-state {
      text-align: center;
      padding: 48px 20px;
      background: var(--bg);
      border-radius: 16px;
    }
    .error-state h2 {
      font-family: 'Fraunces', serif;
      font-size: 22px;
      margin-bottom: 12px;
      color: var(--ink);
    }
    .error-state p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
    }

    .loading {
      font-size: 14px;
      color: var(--mason);
      opacity: 0.7;
      text-align: center;
      margin-top: 80px;
      position: relative;
      z-index: 2;
    }

    /* Desktop polish */
    @media (min-width: 600px) {
      body { padding-top: 60px; }
      .brand-lockup { margin-bottom: 40px; gap: 14px; }
      .brand-lockup img { width: 52px; height: 52px; border-radius: 13px; }
      .wordmark { font-size: 34px; }
      .card-title { font-size: 26px; }
    }

    /* Reduce motion */
    @media (prefers-reduced-motion: reduce) {
      .cta-primary { transition: none; }
    }
  </style>
</head>
<body>
  <div class="brand-lockup">
    <img src="icon-192.png" alt="Odin" width="44" height="44">
    <span class="wordmark"><span class="ws-o">O</span><span class="ws-din">din</span></span>
  </div>

  <div class="container">
    <div class="loading" id="loadingState">Loading…</div>
    <div id="mainContent" style="display:none;"></div>
  </div>

  <script>
    // Must match the SUPABASE_URL / SUPABASE_KEY in app.js byte-for-byte.
    const SUPABASE_URL = 'https://hedywkwmgkvojujvczqr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhlZHl3a3dtZ2t2b2p1anZjenFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY2Mzg0OTMsImV4cCI6MjA3MjIxNDQ5M30.WdGHwr40REynSkC3T3t2nB97FsAH3M0NOE9gv_bLQA8';

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function escHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showError(heading, body) {
      document.getElementById('loadingState').style.display = 'none';
      const main = document.getElementById('mainContent');
      main.style.display = 'block';
      main.innerHTML = `
        <div class="error-state">
          <h2>${escHtml(heading)}</h2>
          <p>${escHtml(body)}</p>
        </div>`;
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      if (!token) {
        showError('Link not found', 'This share link appears to be incomplete.');
        return;
      }
      // 1. Fetch preview data (works for anon + logged-in)
      const { data: invData, error: invErr } = await sb.rpc('get_share_preview', { p_token: token });
      if (invErr || !invData || invData.length === 0) {
        showError('This link has expired', 'Share links are valid for 30 days. Ask your friend to send you a fresh one.');
        return;
      }
      const inv = invData[0];
      const sharerFirst = (inv.display_name || 'Someone').split(' ')[0];
      const itemId = inv.knowledge_item_id;
      // 2. Check session
      let session = null;
      try {
        const { data } = await sb.auth.getSession();
        session = data?.session || null;
      } catch (e) { /* unauthenticated — fine */ }
      if (session) {
        const userId = session.user.id;
        // Check friendship status
        const { data: friendData } = await sb.rpc('check_friendship_status', {
          p_user_a: userId,
          p_user_b: inv.inviter_id
        });
        const isFriend = friendData?.is_friend === true;
        if (isFriend) {
          // Already friends — go straight to the app
          if (itemId) {
            window.location.href = `/?item=${encodeURIComponent(itemId)}`;
          } else {
            window.location.href = '/';
          }
          return;
        }
        // Not friends — auto-connect via token
        const { data: connectData } = await sb.rpc('accept_invite_and_connect', {
          p_token: token,
          p_new_user_id: userId
        });
        document.getElementById('loadingState').style.display = 'none';
        const main = document.getElementById('mainContent');
        main.style.display = 'block';
        if (connectData?.ok) {
          main.innerHTML = `
            <div class="card">
              <div class="card-body" style="text-align:center; padding: 40px 24px;">
                <div style="font-size: 40px; margin-bottom: 16px;">👋</div>
                <h1 class="card-title" style="margin-bottom: 12px;">You're now connected with ${escHtml(sharerFirst)}</h1>
                <p style="font-size:14px; color:var(--muted); margin-bottom: 24px; line-height:1.6;">
                  You can now see each other's discoveries on Odin.
                </p>
                <button class="cta-primary" onclick="window.location.href='${itemId ? `/?item=${encodeURIComponent(itemId)}` : '/'}'">
                  See ${escHtml(sharerFirst)}'s discoveries
                </button>
              </div>
            </div>`;
        } else {
          main.innerHTML = `
            <div class="card">
              <div class="card-body" style="text-align:center; padding: 40px 24px;">
                <h1 class="card-title" style="margin-bottom: 12px;">Something went wrong</h1>
                <p style="font-size:14px; color:var(--muted); margin-bottom: 24px;">Try opening the link again.</p>
                <button class="cta-primary" onclick="window.location.reload()">Try again</button>
              </div>
            </div>`;
        }
        return;
      }
      // 3. Not logged in — render preview card
      const item = itemId ? {
        id: itemId,
        title: inv.item_title,
        type: inv.item_type,
        address: inv.item_address,
        photo_url: inv.item_photo_url,
        personal_note: inv.item_personal_note
      } : null;
      const note = item?.personal_note || '';
      const photo = item?.photo_url || '';
      const address = item?.address || '';
      const typeLabel = item?.type
        ? item.type.charAt(0).toUpperCase() + item.type.slice(1)
        : '';
      document.getElementById('loadingState').style.display = 'none';
      const main = document.getElementById('mainContent');
      main.style.display = 'block';
      main.innerHTML = `
        <div class="card">
          ${photo
            ? `<img class="card-photo" src="${escHtml(photo)}" alt="">`
            : `<div class="card-photo-placeholder"></div>`}
          <div class="card-body">
            <div class="sharer-line">
              <strong>${escHtml(sharerFirst)}</strong> goes here
            </div>
            <h1 class="card-title">${escHtml(item?.title || 'A discovery from your circle')}</h1>
            <div class="card-meta">
              ${typeLabel ? `<span class="badge">${escHtml(typeLabel)}</span>` : ''}
              ${escHtml(address)}
            </div>
            ${note ? `
            <div class="the-word">
              <div class="the-word-label">The Word</div>
              <div class="the-word-text">${escHtml(note)}</div>
            </div>` : ''}
            <button class="cta-primary" id="joinBtn">
              See ${escHtml(sharerFirst)}'s discoveries on Odin
            </button>
          </div>
        </div>
        <p class="tagline">
          Odin is a private discovery network.<br>
          By invite only. No algorithms. No ads.
        </p>
      `;
      document.getElementById('joinBtn').addEventListener('click', () => signIn(token, itemId));
    }

    async function signIn(token, itemId) {
      const btn = document.getElementById('joinBtn');
      if (btn) { btn.disabled = true; btn.textContent = 'Opening sign-in…'; }

      // Stash token AND item id in BOTH storages — survives OAuth redirect on iOS/Android/desktop
      sessionStorage.setItem('odin_invite_token', token);
      localStorage.setItem('odin_invite_token', token);
      if (itemId) {
        sessionStorage.setItem('odin_share_item_id', itemId);
        localStorage.setItem('odin_share_item_id', itemId);
      }

      // Return to whichever origin served share.html — staging stays on staging,
      // www stays on www. Apex (join-odin.com without www) is not a valid
      // Vercel deploy and would 404 after OAuth, so fall back to www in that case.
      const rawOrigin = window.location.origin || 'https://www.join-odin.com';
      const redirectTo = rawOrigin === 'https://join-odin.com'
        ? 'https://www.join-odin.com/'
        : rawOrigin + '/';

      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: redirectTo }
      });

      if (error) {
        if (btn) { btn.disabled = false; btn.textContent = 'Try again'; }
        alert('Could not start sign-in. Please try again.');
      }
    }

    init();
  </script>
</body>
</html>
